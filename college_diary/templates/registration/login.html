<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Вход — Электронный дневник ИМСИТ</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<button class="login-theme-btn" onclick="toggleTheme()">🌙</button>

<div class="login-wrap">
  <div class="login-card">
    <h1>📚 Электронный дневник ИМСИТ</h1>
    <p>Академический колледж — войдите в систему</p>

    {% if form.errors %}
      <div class="alert alert-error">Неверный логин или пароль.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Логин</label>
        <input class="form-control" type="text" name="username" autofocus required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input class="form-control" type="password" name="password" required>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:.5rem" type="submit">Войти</button>
    </form>

    <p style="margin-top:1rem;font-size:.78rem;color:var(--muted);text-align:center">
      Пароль для всех аккаунтов: <b>pass123</b>
    </p>
  </div>
</div>

<script>
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.querySelector('.login-theme-btn').textContent = saved === 'dark' ? '☀️' : '🌙';

  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    document.querySelector('.login-theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
  }
</script>
</body>
</html>
