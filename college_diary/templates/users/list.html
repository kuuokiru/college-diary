{% extends "base.html" %}
{% block title %}Пользователи{% endblock %}
{% block content %}
<div class="page-header"><h1>Пользователи системы</h1></div>
<div class="card">
  <table>
    <thead><tr><th>Логин</th><th>Имя</th><th>Роль</th><th>Email</th></tr></thead>
    <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u.username }}</td>
      <td>{{ u.get_full_name|default:"—" }}</td>
      <td>{{ u.get_role_display }}</td>
      <td>{{ u.email|default:"—" }}</td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
